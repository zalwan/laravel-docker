services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: laravel-docker-app
    container_name: laravel-docker-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      RUN_MIGRATIONS: "true"
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel

  nginx:
    image: nginx:1.27-alpine
    container_name: laravel-docker-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - vendor:/var/www/html/vendor:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel

  node:
    image: node:22-alpine
    container_name: laravel-docker-node
    working_dir: /var/www/html
    command: sh -c "if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    networks:
      - laravel
    profiles:
      - frontend

  db:
    image: mysql:8.4
    container_name: laravel-docker-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - laravel

  redis:
    image: redis:7-alpine
    container_name: laravel-docker-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  db_data:
  redis_data:
  vendor:
  node_modules:
